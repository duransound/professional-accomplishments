# =============================================================================
# Sveltia CMS — the browser editor at /admin
#
# Editing here commits straight to GitHub, which triggers a Cloudflare build,
# which puts the change live. Roughly a minute end to end.
#
# NOTE: saving from the CMS rewrites the whole YAML file, so the explanatory
# comments that used to live in content/*.yaml do not survive. That guidance
# now lives in the "hint" lines below, where it shows up next to the field
# you are actually filling in.
# =============================================================================

backend:
  name: github
  repo: duransound/professional-accomplishments
  branch: main
  # Points at the Cloudflare auth worker. Fill in after deploying it.
  base_url: https://sveltia-cms-auth.iduran87.workers.dev

# Commit messages that read sensibly in the repo history.
site_url: https://duran.show
display_url: https://duran.show

media_folder: sites/work/public/uploads
public_folder: /uploads

collections:
  # ---------------------------------------------------------------------------
  - name: crew
    label: Crew map
    files:
      - name: crew
        label: Crew map
        file: sites/work/content/crew.yaml
        description: >-
          Departments are the coloured lines on the diagram. Seats are the
          stations on them, and every seat also sits in a zone — the place a
          body actually is during a show. The "worked N of M seats" sentence
          counts itself from this file, so there is no number to update by
          hand, and a zone nobody sits in reports itself empty.
        fields:
          - name: page
            label: Page text
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Card summary, widget: text }
              - { name: dek, label: Dek, widget: text }
              - { name: note, label: Demo note, widget: text }
              - { name: intro, label: Intro above the drawing, widget: text }
              - { name: tally, label: Seats-worked sentence, widget: text, hint: 'Keep the {{total}} {{worked}} {{alongside}} words — they count themselves.' }
              - { name: thesis, label: Empty-seat sentence, widget: text, hint: 'Keep the {{invisible}} {{total}} words — they count themselves.' }
              - name: labels
                label: Small labels
                widget: object
                collapsed: true
                fields:
                  - { name: groupSeats, label: Switch label, widget: string }
                  - { name: byRoom, label: Room button, widget: string }
                  - { name: byDepartment, label: Department button, widget: string }
                  - { name: solidHollow, label: Solid/hollow key, widget: string }
                  - { name: contestedKey, label: Contested key, widget: string }
                  - { name: seatHeld, label: Seat held key, widget: string }
                  - { name: workedAlongside, label: Worked alongside key, widget: string }
                  - { name: zoneKey, label: Zone list heading, widget: string }
                  - { name: inTheRoom, label: Panel — in the room, widget: string }
                  - { name: where, label: Panel — where, widget: string }
                  - { name: ifEmpty, label: Panel — if empty, widget: string }
                  - { name: contested, label: Panel — contested, widget: string }
                  - { name: noShowDaySeat, label: No show-day seat, widget: string }
                  - { name: noSeat, label: Empty zone, widget: string }
              - name: status
                label: Status names
                widget: object
                collapsed: true
                fields:
                  - { name: led, label: Led, widget: string }
                  - { name: held, label: Held, widget: string }
                  - { name: adjacent, label: Worked alongside, widget: string }
              - name: visibility
                label: Visibility names
                widget: object
                collapsed: true
                fields:
                  - { name: immediate, label: Immediate, widget: string }
                  - { name: delayed, label: Delayed, widget: string }
                  - { name: invisible, label: Invisible, widget: string }
          - name: zones
            label: Zones — where a body is during a show
            widget: list
            label_singular: Zone
            summary: '{{fields.name}}  ·  {{fields.kind}}'
            collapsed: true
            hint: >-
              Zones are physical locations, not departments. That is the whole
              point of the plate — audio alone sits in three of them, listening
              to three different things. Adding a zone here makes it selectable
              on every seat.
            fields:
              - name: id
                label: ID
                widget: string
                hint: >-
                  Lowercase, no spaces. Seats point at this. If you change it,
                  change every seat that uses it — otherwise the build stops and
                  tells you which seat is orphaned.
              - { name: name, label: Zone name, widget: string }
              - name: kind
                label: Kind
                widget: select
                options:
                  - { label: 'Physical  (a place in the building)', value: physical }
                  - { label: 'Detached  (floats, drawn dashed — Remote)', value: detached }
                  - { label: 'Between shows  (no show-time position at all)', value: program }
              - name: plan
                label: Plan rectangle
                widget: list
                field: { name: n, label: Number, widget: number, value_type: float }
                hint: >-
                  Four numbers — x, y, width, depth — in floor-grid units. The
                  isometric drawing is computed from these, and seats pack into
                  the rectangle automatically, so nothing is placed by hand.
              - name: lift
                label: Riser height
                widget: number
                value_type: float
                default: 0
                hint: >-
                  Same floor-grid units. 0 is floor level. The stage and the
                  front-of-house riser are raised in reality, so they are raised
                  on the drawing.
              - name: perceives
                label: What can be sensed from here
                widget: text
                hint: >-
                  What someone standing in this zone can actually see and hear.
                  This is the argument the zone makes, so it is worth being
                  specific — "every output on a monitor wall, through headphones"
                  says more than "the control room".
              - name: reads
                label: Reads as
                widget: string
                hint: The workplace-org analogue, e.g. The platform team watching dashboards.
          - name: departments
            label: Departments
            widget: list
            label_singular: Department
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Department name, widget: string }
              - name: short
                label: Line label
                widget: string
                hint: Short name shown on the diagram, e.g. Program
              - name: color
                label: Line colour
                widget: string
                pattern: ['^#[0-9a-fA-F]{6}$', 'Must be a six-digit hex colour like #C2372A']
                hint: Six-digit hex, e.g. #C2372A
              - name: seats
                label: Seats
                widget: list
                label_singular: Seat
                summary: '{{fields.title}}  ·  {{fields.status}}'
                fields:
                  - name: id
                    label: ID
                    widget: string
                    hint: Lowercase, no spaces. Must be unique. Changing it is fine; it is only used internally.
                  - { name: title, label: Full title, widget: string }
                  - name: short
                    label: Diagram label
                    widget: string
                    pattern: ['^.{1,24}$', 'Keep this under about 20 characters or labels collide on the diagram']
                    hint: Abbreviated name for the diagram. Under ~20 characters.
                  - name: status
                    label: Status
                    widget: select
                    options:
                      - { label: 'Led or owned  (red station)', value: led }
                      - { label: 'Held personally  (solid station)', value: held }
                      - { label: 'Worked alongside  (dashed station)', value: adjacent }
                    hint: >-
                      This drives the diagram and the seats-worked count. Worth
                      being accurate — an overclaim here is the kind a single
                      interview question exposes.
                  - name: what
                    label: What it owns
                    widget: text
                    hint: One sentence.
                  - name: room
                    label: In the room
                    widget: text
                    hint: What the work actually looks like during a show.
                  - name: reads-title
                    label: Reads as (technology title)
                    widget: string
                    pattern: ['^.{1,24}$', 'Keep this under about 20 characters or labels collide on the diagram']
                    hint: >-
                      Just the job title, no sentence. This is what the
                      vocabulary switch in the masthead shows in place of the
                      diagram label, so it is held to the same length limit.
                  - name: zone
                    label: Zone
                    widget: select
                    options: [stage, camera, client, foh, control, rack, remote, program]
                    hint: >-
                      Where the body actually is during a show. Must match an id
                      in the Zones list above — if it does not, the build stops
                      and names the seat. Use "program" for a role with no
                      show-time position at all.
                  - name: visibility
                    label: How long before anyone notices it is empty
                    widget: select
                    options:
                      - { label: 'Immediate — the room notices', value: immediate }
                      - { label: 'Delayed — it turns up in the recording', value: delayed }
                      - { label: 'Invisible — months, or never', value: invisible }
                    hint: >-
                      The argument the whole plate makes is that the seats
                      costing the most to leave empty are the ones whose absence
                      nobody can see on the day. Worth being honest rather than
                      dramatic — if the room notices in ten seconds, say
                      immediate.
                  - name: consequence
                    label: What goes dark
                    widget: text
                    hint: >-
                      One or two sentences on what actually goes wrong when
                      nobody is in this seat. Plain cause and effect, not a
                      warning. Avoid a colon followed by a space — YAML reads
                      that as a new field.
                  - name: contested
                    label: Contested placement
                    widget: text
                    required: false
                    hint: >-
                      Only for a seat whose zone is genuinely arguable — the
                      technical producer sitting in control versus at the client
                      table, say. Renders as a note on the seat panel. Leave it
                      empty otherwise; an honest note beats a confident wrong one.

  # ---------------------------------------------------------------------------
  - name: lenses
    label: Lenses
    files:
      - name: lenses
        label: Lenses
        file: sites/work/content/lenses.yaml
        description: >-
          Four framings of the same eleven years. The buttons at the top of the
          page switch between them, rewriting the summary and the bullets.
        fields:
          - name: default
            label: Lens shown first
            widget: string
            hint: >-
              Must exactly match one of the lens IDs below. Set it to whichever
              kind of role you are most actively going for.
          - name: lenses
            label: Lenses
            widget: list
            label_singular: Lens
            summary: '{{fields.label}}'
            fields:
              - { name: id, label: ID, widget: string, hint: 'Lowercase, no spaces.' }
              - { name: label, label: Button label, widget: string }
              - name: summary
                label: Summary paragraph
                widget: text
                hint: >-
                  Wrap one phrase in <em>…</em> to give it the red underline.
                  Use it once, on the claim carrying the most weight.
              - name: studio
                label: Bullets — Event Studio Manager
                widget: list
                hint: One bullet per entry.
              - name: crew
                label: Bullets — Event Technician / Crew Lead
                widget: list
                hint: One bullet per entry.

  # ---------------------------------------------------------------------------
  - name: experience
    label: Experience
    files:
      - name: experience
        label: Experience
        file: sites/work/content/experience.yaml
        fields:
          - name: roles
            label: Roles
            widget: list
            label_singular: Role
            summary: '{{fields.years}}  ·  {{fields.title}}'
            fields:
              - { name: years, label: Dates, widget: string, hint: 'e.g. 2022 — 2024' }
              - { name: title, label: Job title, widget: string }
              - { name: org, label: Organisation, widget: string, required: false }
              - name: lensKey
                label: Bullets come from
                widget: select
                required: false
                options:
                  - { label: 'The lens — studio bullets', value: studio }
                  - { label: 'The lens — crew bullets', value: crew }
                hint: >-
                  Use this OR the note below, never both. This makes the
                  bullets change when the reader switches lens. Leave it unset
                  for a role whose text never changes.
              - name: note
                label: Fixed paragraph
                widget: text
                required: false
                hint: A paragraph that never changes with the lens. Leave empty if using the lens above.
              - name: current
                label: Draw the red marker
                widget: boolean
                default: false
                hint: Only one role should have this on.
          - name: education
            label: Education
            widget: object
            fields:
              - { name: degree, label: Degree, widget: string }
              - { name: school, label: School, widget: string }
              - { name: note, label: Note, widget: text, required: false }

  # ---------------------------------------------------------------------------
  - name: kit
    label: Hands on
    files:
      - name: kit
        label: Hands on
        file: sites/work/content/kit.yaml
        description: >-
          Named capabilities only, no explanations. The crew map already does
          the explaining.
        fields:
          - name: groups
            label: Groups
            widget: list
            label_singular: Group
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Group name, widget: string }
              - { name: items, label: Items, widget: list, hint: 'One per entry. These render as small tags.' }

  # ---------------------------------------------------------------------------
  - name: site
    label: Site details
    files:
      - name: site
        label: Site details
        file: sites/work/content/site.yaml
        fields:
          - { name: name, label: Name, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: linkedinLabel, label: LinkedIn label, widget: string, hint: 'Short form shown on the page, e.g. in/duranian' }
          - name: roleProduction
            label: Role line — production vocabulary
            widget: string
            pattern: ['^.{1,52}$', 'Keep it to one line — under about 52 characters']
            hint: Shown in the lower third when the switch reads Production.
          - name: roleTechnology
            label: Role line — technology vocabulary
            widget: string
            pattern: ['^.{1,52}$', 'Keep it to one line — under about 52 characters']
            hint: Shown in the lower third when the switch reads Technology.
          - name: tagline
            label: Search description
            widget: text
            hint: Shown by search engines and when the link is shared. Two sentences.
          - { name: projectsIntro, label: Line above the project cards, widget: text, required: false }
          - { name: pitch, label: Contact sentence, widget: text, required: false }
          - name: now
            label: Status lamp — what you are working on
            widget: object
            required: false
            collapsed: false
            hint: >-
              The lit line beside the vocabulary switch. Delete the whole block
              and the lamp disappears — better than leaving a line that has
              stopped being true.
            fields:
              - { name: label, label: Label, widget: string, pattern: ['^.{1,16}$', 'One or two words'], default: Now }
              - name: text
                label: What you are working on
                widget: text
                pattern: ['^[\\s\\S]{1,110}$', 'Keep it to one sentence — under about 110 characters']
                hint: One sentence. It sits in the masthead, so it has to stay short.
              - name: href
                label: Link to
                widget: string
                required: false
                hint: Optional. A path like /projects/room-readiness-dashboard/ makes the whole block clickable.
              - name: updated
                label: Last updated
                widget: date
                format: 'yyyy-MM-dd'
                hint: >-
                  Shown beside the label. A status line with no date quietly
                  becomes a lie, so the date is required and visible.

  # ---------------------------------------------------------------------------
  - name: notes
    label: Notes
    label_singular: Note
    folder: sites/work/content/notes
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: summary, label: Summary, widget: text, hint: 'One sentence, shown in the list on the homepage.' }
      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: >-
          While this is on, the note gets no public page at all — not even an
          unlinked URL. Turn it off to publish.
      - { name: body, label: Body, widget: markdown }
