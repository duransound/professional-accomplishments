# The "Work with me" sheet, right after Projects. layout: both shows two
# equal sides (companies first, then hiring teams); layout: roles puts hiring
# first with the engagements in a quieter box underneath. Delete the whole block and
# the sheet disappears. `subject` is the email subject line the button fills
# in, so you can tell at a glance where a message came from.
hire:
  layout: roles
  label: Looking for
  heading: Full-time or contract roles running live events, studios, and the AV programs behind them.
  rolesTitle: For hiring teams
  offersButton: Start a project conversation
  offersSubject: A project for Ian Duran
  roles:
    - title: AV & events technology
      line: Owning studios, executive events and all-hands — the rooms, the standard, and the vendors who keep them working.
    - title: Production & technical programs
      line: Running a show or a program end to end, from scope and budget to the call on the day.
    - title: Creative production & account management
      line: The client side of the same work — shaping what gets made and keeping the relationship healthy.
  note: San Francisco Bay Area. Open to full-time, contract, and temporary roles.
  button: Email me about a role
  subject: A role for Ian Duran
