# ============================================================================
# THE CREW MAP — the most important file here.
#
# Each department becomes a coloured line on the diagram. Each seat becomes a
# station on that line. Everything feeds the ON AIR terminus.
#
# status must be exactly one of:
#   led       red station    - you owned it
#   held      solid station  - you personally worked it
#   adjacent  dashed station - you worked alongside it but never sat in it
#
# The "worked N of M seats" sentence above the diagram counts itself from this
# file. Never type that number anywhere.
#
# Per seat:
#   title  full name, shown in the detail panel
#   short  abbreviated name for the diagram — keep under about 20 characters
#          or labels collide with their neighbours
#   what   one sentence: what this seat owns
#   room   what the work actually looks like during a show
#   reads  the closest equivalent in a technology company.
#          Wrap the job title in <strong>...</strong>
#
# NOTE: colours start with # so they MUST stay in quotes. Everything else can
# be written plainly.
#
# Order matters. Seats appear left to right in the order listed.
# ============================================================================

departments:
  - name: Program & content
    short: Program
    color: "#C2372A"
    seats:
      - id: resm
        title: Regional Event Studio Manager
        short: Regional Studio Mgr
        status: led
        what: >
          Owns a portfolio of rooms across a region — the budget, the standard,
          and the partners who keep them working.
        room: >
          Decides what every studio in the region must be capable of, funds it,
          and holds vendor teams to it. Answerable for a room in São Paulo
          behaving exactly like a room in the Bay Area, so a traveling
          executive program never has to care which one it landed in.
        reads: >
          <strong>Regional workplace technology manager.</strong> Portfolio
          ownership with budget and vendor accountability attached. Of
          everything on this chart, the seat that transfers most directly.

      - id: pm
        title: Program Management
        short: Program Mgmt
        status: led
        what: >
          Owns the portfolio of programs rather than any single show.
        room: >
          Intake criteria, scheduling across venues, staffing models, vendor
          contracts, and a budget that spans a year of events instead of one
          night.
        reads: >
          <strong>Program manager</strong>, unchanged. Same job, different
          vocabulary — which is exactly the problem this page exists to solve.

      - id: tp
        title: Technical Producer
        short: Technical Producer
        status: held
        what: >
          Owns the technical plan for a show, its budget, and the people who
          execute it.
        room: >
          Turns what the producer wants into gear, crew, lead times, and a
          number. Present through rehearsal to catch what the plan missed while
          there is still time to fix it.
        reads: >
          <strong>Technical program manager.</strong> The cleanest one-to-one
          on this whole chart — scope, budget, dependencies, and a delivery
          date that does not move.

      - id: prod
        title: Producer
        short: Producer
        status: adjacent
        what: >
          Owns the outcome. Decides what the show is and whether it worked.
        room: >
          Sets content and rehearsal priorities, and makes the calls that trade
          scope against time. Talks to the client, not to the rack.
        reads: >
          <strong>Product owner.</strong> Accountable for the thing, not the
          mechanism.

      - id: sm
        title: Stage Manager / Show Caller
        short: Show Caller
        status: held
        what: >
          Owns time and sequence once the show is running.
        room: >
          Calls every cue — standby camera two, take two. Holds the entire
          sequence in their head and communicates continuously without
          editorializing.
        reads: >
          <strong>Incident commander.</strong> Status on a fixed cadence under
          real pressure, and no drama in the voice.

  - name: Audio
    short: Audio
    color: "#2E7A6B"
    seats:
      - id: a1
        title: A1 — Audio Lead
        short: A1 Audio Lead
        status: held
        what: >
          Owns everything anyone hears.
        room: >
          Designs the audio system, sets gain structure, and mixes the show
          live. One person, one mix, and no second take.
        reads: >
          <strong>Domain lead or principal engineer.</strong> Sole technical
          owner of a subsystem, making irreversible calls in real time.

      - id: a2
        title: A2 — Audio Assistant
        short: A2 Audio Asst
        status: held
        what: >
          The A1's hands in the room.
        room: >
          Mics talent, coordinates wireless frequencies, runs cable, and fixes
          the problem while the show keeps going around them.
        reads: >
          <strong>Site reliability or field engineer.</strong> Diagnosing live,
          without taking the service down to do it.

      - id: rf
        title: RF & Comms Coordinator
        short: RF & Comms
        status: held
        what: >
          Owns the spectrum and the intercom.
        room: >
          Coordinates wireless frequencies so nothing steps on anything else,
          and keeps crew communications working when they matter most.
        reads: >
          <strong>Network engineer.</strong> A finite shared resource,
          allocated in advance so nobody collides at the worst moment.

  - name: Video
    short: Video
    color: "#D89A2C"
    seats:
      - id: td
        title: Technical Director
        short: Technical Director
        status: held
        what: >
          Executes the show live on the switcher.
        room: >
          Every cut and every transition, in real time, on the producer's call.
          There is no undo.
        reads: >
          <strong>Release engineer at the moment of deploy.</strong>
          Irreversible actions, executed calmly, with everyone watching.

      - id: v1
        title: Video Engineer (V1)
        short: Video Eng V1
        status: held
        what: >
          Owns signal integrity.
        room: >
          Shades and matches cameras so ten sources look like one show, and
          handles routing, formats, and conversion between them.
        reads: >
          <strong>Platform or quality engineer.</strong> Consistency across
          heterogeneous inputs nobody else wants to think about.

      - id: cam
        title: Camera Operator
        short: Camera Op
        status: held
        what: >
          Owns the frame.
        room: >
          Composes and operates, taking direction while anticipating the shot
          that will be asked for next.
        reads: >
          <strong>Individual contributor executing to spec</strong>, with
          enough judgment to be trusted off-script.

      - id: gfx
        title: Graphics Operator
        short: Graphics Op
        status: held
        what: >
          Owns everything on screen that isn't a camera.
        room: >
          Builds lower thirds, titles, and slide playback, then triggers them
          live on cue.
        reads: >
          <strong>Design operations.</strong> An asset pipeline plus live
          execution against it.

      - id: pb
        title: Playback Operator
        short: Playback Op
        status: held
        what: >
          Rolls recorded content on cue.
        room: >
          Owns the media, its formats, and hitting the frame exactly when the
          call comes.
        reads: >
          <strong>Content operations.</strong>

  - name: Systems & delivery
    short: Systems
    color: "#47539B"
    seats:
      - id: bcast
        title: Broadcast / Streaming Engineer
        short: Broadcast Eng
        status: held
        what: >
          Owns delivery to everyone who isn't in the room.
        room: >
          Encoders, bonded connections, platform endpoints, and the bitrate
          math that keeps a stream stable for an audience you cannot see.
        reads: >
          <strong>Infrastructure or DevOps.</strong> The pipeline between what
          is produced and who receives it.

      - id: ops
        title: Studio Operations
        short: Studio Ops
        status: led
        what: >
          Owns readiness between shows.
        room: >
          Preventative maintenance, spares strategy, and room certification.
          The unglamorous work that makes it just works true on the day.
        reads: >
          <strong>Workplace technology or IT operations.</strong> Judged
          entirely by the absence of failures.

      - id: sd
        title: Systems Designer
        short: Systems Designer
        status: adjacent
        what: >
          Designs the room before there is a room.
        room: >
          Signal flow drawings, rack elevations, and as-built documentation.
          Decides what a space will be capable of for the next decade.
        reads: >
          <strong>Solutions architect.</strong> The same drawings in different
          notation.

      - id: ld
        title: Lighting Director
        short: Lighting Dir
        status: adjacent
        what: >
          Owns what the camera sees.
        room: >
          Designs and operates lighting for the room and for the lens at once —
          two requirements that routinely disagree.
        reads: >
          <strong>Specialist domain lead</strong> balancing competing
          non-negotiables.
