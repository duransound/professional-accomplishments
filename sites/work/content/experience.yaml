# ============================================================================
# Roles and education.
#
# Roles appear in the order listed here, newest first.
#
# A role gets its bullet points in one of two ways:
#   lensKey: studio   -> bullets come from lenses.yaml and change with the lens
#   lensKey: crew     -> same, from the "crew" list in lenses.yaml
#   note: ...         -> one fixed paragraph that never changes
# Use one or the other, not both.
#
# current: true draws the red marker on the timeline. Only one role should
# have it.
# ============================================================================

