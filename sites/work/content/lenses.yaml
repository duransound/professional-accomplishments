# ============================================================================
# The lens. Three framings of the same eleven years, one per kind of role you
# are going for — the same three as the Looking for section. The buttons at the top of the page switch between them.
#
# Each lens rewrites:
#   summary  - the paragraph under "Summary"
#   studio   - bullets for the Event Studio Manager role
#   crew     - bullets for the Event Technician / Crew Lead role
#
# Wrap a phrase in <em>...</em> to give it the red underline in the summary.
# Use it once per summary, on the claim that carries the most weight.
#
# The "default" below is the lens a first-time visitor sees. Set it to
# whichever kind of role you are most actively going for.
# ============================================================================

default: events-av

lenses:
  - id: events-av
    label: AV & events technology
    summary: >
      Eleven years at Google, ending as Event Studio Manager for the Americas
      and Latin America — <em>operating budget and readiness standard for more
      than ten studios</em> across two regions. Looking to own the rooms,
      executive events and all-hands behind a company's biggest moments.
    studio:
      - >
        Managed the operating budget for 10+ event studios across the Americas
        and Latin America
      - >
        Set and enforced room readiness and preventative maintenance standards
        across a distributed portfolio
      - >
        Held technical capability consistent across venues, so a traveling
        executive program performed identically in every space
      - >
        Owned vendor partner performance for regional AV operations
    crew:
      - >
        Technical point of contact for executive-level productions across the
        studio footprint
      - >
        Rebuilt production delivery for hybrid operation in 2020, against a
        deadline nobody could move
      - >
        Hands-on ownership of studio systems: video switching, audio consoles,
        multi-camera, streaming encoders

  - id: production
    label: Production & technical programs
    summary: >
      Eleven years running technical execution for executive programs at
      Google — <em>from scope and budget to the call on the day</em>, with
      vendor accountability for 10+ studios across two regions. Looking to run
      shows and programs end to end.
    studio:
      - >
        Owned intake through delivery for recurring high-visibility programs,
        defining scoping criteria, lead times, and staffing requirements with
        partner teams
      - >
        Built repeatable operating frameworks for flagship events, replacing
        ad-hoc coordination with documented process
      - >
        Aligned Event Production, Communications, and Workplace organizations
        on shared readiness standards across a distributed operation
      - >
        Negotiated staffing and lead-time expectations between internal
        programs and vendor crews
    crew:
      - >
        Drove a production model change — hybrid delivery — across a
        multi-region team under a hard external deadline
      - >
        Directed contractor crews through rehearsal and live execution
      - >
        Served as escalation point during live execution, communicating status
        and risk to non-technical executive stakeholders in real time

  - id: creative
    label: Creative production & account management
    summary: >
      Eleven years at Google <em>turning what executives described into
      shows a crew could deliver</em> — and keeping the partners and vendors
      behind them on side. Looking for the client side of the same work:
      shaping what gets made and owning the relationship.
    studio:
      - >
        Translated executive and non-technical stakeholder vision into
        executable technical plans
      - >
        Defined what was and wasn't achievable within a given budget and lead
        time, and said so early
      - >
        Vendor manager for distributed partner teams across two regions,
        accountable for delivery quality
    crew:
      - >
        Technical point of contact for executive-level productions, from first
        brief through the live show
      - >
        Clear stakeholder communication while a live event was still running
      - >
        Trained and supported others through tutoring and crew leadership
